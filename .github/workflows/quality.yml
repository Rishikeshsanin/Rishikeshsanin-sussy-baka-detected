name: quality

on:
  push:
    branches: [main, develop/v2]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AI_PROVIDER: mock
      SITE_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Production runtime smoke test
        shell: bash
        run: |
          npm run start > /tmp/sbd-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          READY=0
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /tmp/sbd-home.html; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/sbd-next.log
            exit 1
          fi

          grep -q "Sussy Baka Detected" /tmp/sbd-home.html

          curl --fail --silent --show-error \
            -H 'content-type: application/json' \
            -d '{"gameId":"ci-smoke","questionNumber":1,"history":[{"questionId":"first-real-person","question":"Is your character a real person?","answer":"yes","timestamp":1}],"rejectedGuesses":[],"aiMemory":{"summary":"","candidateHypotheses":[]},"turnReason":"answer"}' \
            http://127.0.0.1:3000/api/game/turn > /tmp/sbd-turn.json

          node -e 'const fs=require("fs"); const data=JSON.parse(fs.readFileSync("/tmp/sbd-turn.json","utf8")); if(!["question","guess","give_up"].includes(data.type)) process.exit(1);'
